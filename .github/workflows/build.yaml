name: build

run-name: build ${{ inputs.rewire_version && format('v{0}', inputs.rewire_version) || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rewire_version:
        description: "Rewire version (e.g. 0.2.6)"
        required: true

permissions:
  contents: read

env:
  IMAGE_NAME: rewirerun/rewire

jobs:
  build:
    name: ${{ matrix.ros_distro }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Determine version
        run: |
          if [ -n "${{ inputs.rewire_version }}" ]; then
            echo "VERSION=${{ inputs.rewire_version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            REWIRE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.ros_distro }}
            ${{ env.IMAGE_NAME }}:${{ matrix.ros_distro }}-${{ env.VERSION }}
